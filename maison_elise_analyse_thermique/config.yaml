name: Maison Élise — Analyse thermique
slug: maison_elise_analyse_thermique
description: Analyse thermique déterministe, expertise LLM unique, synthèse Assist et rapport expert publié dans Home Assistant.
version: 0.1.0-dev.17
url: https://github.com/brunofoxmulder/maison-elise-analyse-thermique
startup: application
boot: manual
init: false
homeassistant_api: true
arch:
  - amd64
map:
  - homeassistant_config:ro
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: API HTTP de validation
webui: http://[HOST]:[PORT:8099]/diagnostic
options:
  service_account_file: /homeassistant/Google/service_account.json
  spreadsheet_id: ""
  worksheet_name: Confort thermique
  timezone: Europe/Paris
  weather_entity: weather.dammarie_les_lys
  notification_service: ""
  mail_entity: ""
schema:
  service_account_file: str
  spreadsheet_id: str
  worksheet_name: str
  timezone: str
  weather_entity: str?
  notification_service: str?
  mail_entity: str?
